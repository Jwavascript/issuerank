openapi: 3.1.0
info:
  title: 이슈랭크 API
  version: 0.7.0
  description: 화면(index.html)과 홈 화면 위젯 · 인스타 카드 페이지(card.html)가 서버에 바라는 랭킹 · 위젯 · 카드 · 북마크 · 폴더 · 아침 알림 구독 API 계약.

servers:
  - url: http://localhost:3000

# 인증은 ex10, 개인 북마크·폴더는 ex11 서버 세션 소유자만 접근한다.
security: []

paths:
  /api/auth/sign-up/email:
    post:
      operationId: signUpEmail
      summary: 이메일 회원가입과 자동 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: 사용자와 세션 생성. HttpOnly·SameSite=Lax 쿠키와 Cache-Control no-store. HTTPS에서는 Secure.
          headers:
            Set-Cookie: { schema: { type: string }, description: 세션 쿠키. 여러 헤더를 각각 전달한다. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/AuthInvalid' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '422':
          description: 중복 이메일(USER_ALREADY_EXISTS_USE_ANOTHER_EMAIL), 새 세션 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
  /api/auth/sign-in/email:
    post:
      operationId: signInEmail
      summary: 이메일 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: 사용자 정보와 세션 쿠키. Cache-Control no-store.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/AuthInvalid' }
        '401':
          description: 이메일 또는 비밀번호 불일치(INVALID_EMAIL_OR_PASSWORD), 새 세션 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
  /api/auth/get-session:
    get:
      operationId: getSession
      summary: 쿠키의 현재 세션 조회
      parameters:
        - in: cookie
          name: better-auth.session_token
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 유효하면 user·session, 쿠키 없음·변조·만료는 null. Cache-Control no-store.
          content:
            application/json:
              schema:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [user, session]
                    properties:
                      user: { $ref: '#/components/schemas/AuthUser' }
                      session: { type: object, additionalProperties: true }
  /api/auth/sign-out:
    post:
      operationId: signOut
      summary: 현재 서버 세션 삭제와 쿠키 만료
      parameters:
        - in: cookie
          name: better-auth.session_token
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 세션 폐기, 이전 쿠키 재사용 시 null. Cache-Control no-store.
          headers:
            Set-Cookie: { schema: { type: string }, description: 세션 쿠키 만료 }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '403': { $ref: '#/components/responses/AuthForbidden' }
  /api/auth/sign-in/social:
    post:
      operationId: signInSocial
      summary: Google 로그인 시작(운영 O2)
      description: >-
        GOOGLE_CLIENT_ID · GOOGLE_CLIENT_SECRET이 둘 다 있을 때만 켜진다. 화면은 아래 3칸만 보내고, 응답 url이
        https://accounts.google.com/ 으로 시작할 때만 그 주소로 이동한다(fetch는 200 응답의 Location을 따라가지 않음).
        Google 주소는 response_type=code · client_id · redirect_uri({BETTER_AUTH_URL}/api/auth/callback/google) ·
        scope=openid email profile · state · code_challenge(S256) · include_granted_scopes=true이고 access_type · prompt · nonce는 없다.
        DB 쓰기 없음. Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, callbackURL, errorCallbackURL]
              properties:
                provider: { type: string, enum: [google] }
                callbackURL:
                  type: string
                  description: 로그인 뒤 돌아올 주소. /로 시작하는 상대 주소(화면은 /?login=google[&issue={이슈 id}][#보기]) 또는 같은 origin
                errorCallbackURL:
                  type: string
                  description: 실패 · 취소 때 돌아올 주소(화면은 callbackURL과 같은 값). 뒤에 error={코드}가 붙는다
      responses:
        '200':
          description: Google 동의 화면 주소. 상태 쿠키(state · code_verifier · 돌아올 주소 · 만료 10분을 암호화) 1개.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: better-auth.oauth_state(HTTPS에서는 __Secure- 접두 · Secure), HttpOnly · SameSite=Lax · Path=/ · Max-Age=600
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [url, redirect]
                properties:
                  url: { type: string, format: uri, description: 'https://accounts.google.com/o/oauth2/v2/auth?…' }
                  redirect: { type: boolean, const: true }
        '403':
          description: callbackURL · errorCallbackURL이 /로 시작하는 상대 주소도 같은 origin도 아님(INVALID_CALLBACK_URL · INVALID_ERROR_CALLBACK_URL), 쿠키가 있는 요청의 다른 Origin(INVALID_ORIGIN). 쿠키 · DB 쓰기 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '404':
          description: Google 로그인이 꺼짐(PROVIDER_NOT_FOUND — 환경 변수 둘 중 하나라도 없음) 또는 본문 idToken 로그인(ID_TOKEN_NOT_SUPPORTED, 닫음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
  /api/auth/callback/google:
    get:
      operationId: googleCallback
      summary: Google에서 돌아옴(운영 O2)
      description: >-
        상태 쿠키 안의 state와 쿼리 state가 같아야 한다. 같으면 code를 Google 토큰 주소에서 바꿔 ID 토큰의 sub · email · email_verified · name을 읽고,
        처음 보는 Google 계정이면 가입(같은 이메일의 기존 계정과는 잇지 않음), 같은 sub면 그 계정으로 로그인한다. Google 토큰은 저장하지 않는다.
        응답은 모두 302 · Cache-Control no-store.
      parameters:
        - { in: query, name: state, required: false, schema: { type: string } }
        - { in: query, name: code, required: false, schema: { type: string } }
        - { in: query, name: error, required: false, schema: { type: string }, description: Google이 붙이는 오류(취소면 access_denied) }
        - { in: cookie, name: better-auth.oauth_state, required: false, schema: { type: string } }
      responses:
        '302':
          description: >-
            성공이면 Location = 시작 때의 callbackURL. 실패면 Location = errorCallbackURL 뒤에 error={코드}(해시보다 앞, 예 /?login=google&error=access_denied#bookmarks):
            access_denied(Google에서 취소) · account_not_linked(같은 이메일의 이메일 · 비밀번호 계정이 있음, 새 행 0) · state_mismatch(state 다름 · 10분 지남) ·
            invalid_code(코드 교환 실패) 등. 상태 쿠키가 없거나 읽을 수 없으면 Location = /?error=state_mismatch(깨진 쿠키는 state_invalid).
          headers:
            Location: { schema: { type: string } }
            Set-Cookie:
              schema: { type: string }
              description: 성공이면 세션 쿠키(better-auth.session_token, 이메일 로그인과 같은 속성 · 7일)와 상태 쿠키 만료. 여러 헤더를 각각 전달한다
            Cache-Control: { schema: { type: string, const: no-store } }
  /api/rankings:
    get:
      operationId: getRankings
      summary: 그날 섹션별 Top 5 랭킹
      description: date를 생략하면 가장 최근 수집일의 랭킹을 준다.
      parameters:
        - name: date
          in: query
          required: false
          description: 조회할 날짜(KST, YYYY-MM-DD). 생략하면 가장 최근 수집일. 오늘(KST) 이후면 400.
          schema:
            type: string
            format: date
          example: '2026-10-07'
      responses:
        '200':
          description: 랭킹
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ranking'
              example:
                date: '2026-10-07'
                updatedAt: '2026-10-07T06:00:00+09:00'
                sections:
                  - key: pol
                    name: 정치
                    issues:
                      - id: '2026-10-07-pol-0'
                        date: '2026-10-07'
                        section: pol
                        rank: 1
                        title: 내년도 예산안 국회 상임위 심사 본격화
                        summary:
                          - 상임위별 예비심사가 시작돼 증액·감액 쟁점이 드러나고 있다.
                          - 여야는 지역 SOC와 복지 예산 규모를 두고 이견을 보였다.
                          - 예결위는 다음 달 중순까지 수정안을 마련할 계획이다.
                        articleCount: 184
                        url: https://news.naver.com/
                  - key: eco
                    name: 경제
                    issues:
                      - id: '2026-10-07-eco-0'
                        date: '2026-10-07'
                        section: eco
                        rank: 1
                        title: 기준금리 동결, 연내 인하 가능성 시사
                        summary:
                          - 한국은행이 기준금리를 현 수준에서 동결했다.
                          - 물가 둔화 흐름이 이어지면 인하를 검토할 수 있다고 밝혔다.
                          - 시장은 연말 인하 가능성을 높게 반영하기 시작했다.
                        articleCount: 152
                        url: https://news.naver.com/
                  - key: soc
                    name: 사회
                    issues:
                      - id: '2026-10-07-soc-6'
                        date: '2026-10-07'
                        section: soc
                        rank: 1
                        title: 저출생 대책, 육아휴직 급여 상한 인상
                        summary: null
                        articleCount: 97
                        url: https://news.naver.com/
                  - key: cul
                    name: 생활·문화
                    issues:
                      - id: '2026-10-07-cul-1'
                        date: '2026-10-07'
                        section: cul
                        rank: 1
                        title: 국내 영화 관객 수 회복세
                        summary:
                          - 추석 연휴 개봉작 흥행으로 관객 수가 반등했다.
                          - 중예산 영화들이 입소문을 타며 장기 상영 중이다.
                          - 업계는 연말까지 회복세가 이어질지 주목한다.
                        articleCount: 76
                        url: https://news.naver.com/
                  - key: wor
                    name: 세계
                    issues:
                      - id: '2026-10-07-wor-4'
                        date: '2026-10-07'
                        section: wor
                        rank: 1
                        title: 기후총회 앞두고 감축 목표 상향 압박
                        summary:
                          - 주요국에 2035년 감축 목표 제출이 요구되고 있다.
                          - 개도국은 재원 지원 확대를 조건으로 내걸었다.
                          - 총회는 다음 달 개막한다.
                        articleCount: 63
                        url: https://news.naver.com/
                  - key: it
                    name: IT·과학
                    issues:
                      - id: '2026-10-07-it-1'
                        date: '2026-10-07'
                        section: it
                        rank: 1
                        title: 차세대 HBM 양산 경쟁 본격화
                        summary:
                          - 국내 업체들이 차세대 고대역폭 메모리 샘플 공급을 시작했다.
                          - 주요 GPU 업체의 인증 일정이 관건이다.
                          - 내년 상반기 양산 체제 전환이 목표다.
                        articleCount: 141
                        url: https://news.naver.com/
        '400':
          description: 날짜 형식이 잘못되었거나 오늘(KST) 이후 날짜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badFormat:
                  summary: 형식이 잘못된 날짜
                  value:
                    message: 날짜는 YYYY-MM-DD 형식으로 입력해 주세요
                future:
                  summary: 오늘 이후 날짜
                  value:
                    message: 오늘 이후 날짜는 조회할 수 없습니다
        '404':
          description: 해당 날짜의 랭킹 데이터 없음(date를 생략했는데 저장된 랭킹이 하나도 없을 때 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 해당 날짜의 랭킹 데이터가 없습니다

  /api/widget:
    get:
      operationId: getWidget
      summary: 홈 화면 위젯 헤드라인(순서 · 링크를 서버가 정함)
      description: >-
        로그인 · 쿠키 없이 부르는 공개 API. 날짜는 date를 생략한 /api/rankings와 같은 최근 수집일이고 쿼리는 받지 않는다(붙어도 무시).
        items는 그날 /api/rankings 카드 전부(섹션마다 Top 5, 대체 섹션 포함, 최대 30)를 섹션 1위들 → 나머지 순으로,
        각각 연관기사 수 ↓ → 중요도 ↓ → 최신 기사 발행 시각 ↓ → id 자연 순서로 늘어놓은 것이다.
        위젯은 앞에서부터 크기만큼 그리며, 연관기사 수 · 요약 · 원문 url · rank는 주지 않는다.
      responses:
        '200':
          description: 위젯 목록
          headers:
            Cache-Control:
              description: CDN이 지역마다 300초 보관한다(Vercel은 클라이언트에 s-maxage를 뺀 값을 준다). 404 · 500 · 502에는 붙지 않는다.
              schema: { type: string, const: 'public, max-age=0, s-maxage=300' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
              example:
                date: '2026-10-07'
                updatedAt: '2026-10-07T06:00:00+09:00'
                updatedLabel: '10.7 오전 6:00 수집'
                morePath: '/#list'
                items:
                  - id: '2026-10-07-pol-0'
                    section: pol
                    title: 내년도 예산안 국회 상임위 심사 본격화
                    path: '/?issue=2026-10-07-pol-0'
                  - id: '2026-10-07-eco-0'
                    section: eco
                    title: 기준금리 동결, 연내 인하 가능성 시사
                    path: '/?issue=2026-10-07-eco-0'
                  - id: '2026-10-07-it-1'
                    section: it
                    title: 차세대 HBM 양산 경쟁 본격화
                    path: '/?issue=2026-10-07-it-1'
        '404':
          description: 저장된 랭킹이 하나도 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 해당 날짜의 랭킹 데이터가 없습니다

  /api/card:
    get:
      operationId: getCard
      summary: 인스타 "오늘의 이슈" 카드 이미지(1080×1350 PNG)
      description: >-
        로그인 · 쿠키 없이 부르는 공개 API. 그날 /api/widget 순서(섹션 1위들 → 나머지)의 앞 6개를 그린다(hide로 뺀 id는 건너뛰고 다음 순서로 채움, 항목이 적으면 있는 만큼).
        날짜 · 제목(그림 문자 제거, 34자 넘으면 33자 + …, 자른 끝 공백은 지움) · 섹션 · 사이트 주소 · 수집 시각 · 출처 문구만 넣고, 본문 · 요약 · 연관기사 수 · 원문 이미지 · 언론사 로고는 넣지 않는다.
        PNG를 끝까지 만든 뒤 응답한다(렌더가 실패하면 500).
      parameters:
        - $ref: '#/components/parameters/CardDate'
        - $ref: '#/components/parameters/CardHide'
      responses:
        '200':
          description: 카드 PNG(4:5 세로, 밝은 카드 하나)
          headers:
            Cache-Control:
              description: CDN이 지역마다 300초 보관한다(Vercel은 클라이언트에 s-maxage를 뺀 값을 준다). 실패 응답에는 붙지 않는다.
              schema: { type: string, const: 'public, max-age=0, s-maxage=300' }
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/CardBadRequest'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '500':
          description: 카드 렌더 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 카드를 만들 수 없습니다
        '502':
          $ref: '#/components/responses/CardUnavailable'

  /api/card/caption:
    get:
      operationId: getCardCaption
      summary: 카드와 같은 6개 · 인스타 캡션
      description: >-
        /api/card와 같은 쿼리 · 같은 날짜 규칙 · 같은 6개(같은 순서)를 JSON으로 준다. items의 title은 다듬기 전 원문 제목이다.
        caption은 날짜 줄 · 번호 6줄([섹션] 제목, 그림 문자 제거, 100자 넘으면 99자 + …, 자른 끝 공백은 지움) · 사이트 안내 · 출처 문구 · 해시태그 5개로 된 2,200자 이하 글이다.
      parameters:
        - $ref: '#/components/parameters/CardDate'
        - $ref: '#/components/parameters/CardHide'
      responses:
        '200':
          description: 카드 데이터와 캡션
          headers:
            Cache-Control:
              description: /api/card와 같음
              schema: { type: string, const: 'public, max-age=0, s-maxage=300' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardCaption'
              example:
                date: '2026-10-07'
                dateLabel: 10월 7일 수요일
                updatedLabel: '10.7 오전 6:00 수집'
                items:
                  - id: '2026-10-07-pol-0'
                    section: pol
