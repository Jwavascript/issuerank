              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 폴더를 찾을 수 없습니다

  /api/push/subscriptions:
    post:
      operationId: subscribePush
      summary: 아침 알림 구독(이 기기, O5)
      description: >-
        로그인 · 쿠키 없이 기기 단위. 본문은 브라우저 PushSubscription.toJSON() 그대로이고 다른 칸 · expirationTime은 무시한다.
        검사 순서는 Origin(화면 주소 = BETTER_AUTH_URL의 origin일 때만) → 본문 크기(4,096B 이하) → JSON · 칸 → endpoint → 키 → 저장.
        endpoint는 https:이고 호스트가 fcm.googleapis.com · updates.push.services.mozilla.com(정확히) 또는 *.push.apple.com · *.notify.windows.com(점부터 접미사)일 때만 받는다
        (포트 표기 · 사용자 정보 · IP 주소 · localhost · # · 공백 없음, 2,048자 이하). 같은 endpoint를 다시 보내면 키만 갱신한다(행 하나).
        새 endpoint 행을 넣으면 201 { created: true }, 이미 있던 endpoint면 204이고, 화면은 이미 있던 기기 구독을 다시 보냈는데 201이면(서버에서 지워진 구독) 구독을 새로 만든다(O7).
        모든 응답은 Cache-Control no-store이고 쿠키를 만들지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionIn'
            example:
              endpoint: 'https://fcm.googleapis.com/fcm/send/example-device-token'
              expirationTime: null
              keys:
                p256dh: BCVxsr7N_eNgVRqvHtD0zTZsEc6-VV-JvLexhqUzORcxaOzi6-AYWXvTBHm4bjyPjs7Vd8pZGH6SRpkNtoIAiw4
                auth: BTBZMqHH6r4Tts7J_aSIgg
      responses:
        '201':
          description: 새 기기(새 endpoint 행을 넣음, O7)
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionCreated'
              example:
                created: true
        '204':
          description: 이미 있던 기기(키 갱신, 본문 없음)
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: '#/components/responses/PushBadRequest' }
        '403': { $ref: '#/components/responses/PushForbidden' }
        '413': { $ref: '#/components/responses/PushTooLarge' }
        '503':
          description: 새 endpoint인데 구독이 이미 5,000개(이미 있는 기기의 키 갱신은 됨)
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 지금은 알림을 켤 수 없습니다
    delete:
      operationId: unsubscribePush
      summary: 아침 알림 해지(이 기기, O5)
      description: >-
        그 endpoint의 행을 지운다. 없어도 204(여러 번 같아도 됨). Origin · 크기 · endpoint 검사는 구독과 같다.
        알림 권한을 끄거나 데이터를 지운 기기의 행은 다음 발송 때 푸시 서비스의 404 · 410으로 지워진다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRef'
            example:
              endpoint: 'https://fcm.googleapis.com/fcm/send/example-device-token'
      responses:
        '204':
          description: 지웠거나 원래 없음(본문 없음)
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: '#/components/responses/PushBadRequest' }
        '403': { $ref: '#/components/responses/PushForbidden' }
        '413': { $ref: '#/components/responses/PushTooLarge' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth 서버 세션. 요청 userId 값은 무시하고 세션의 사용자만 처리한다. 개인 API의 모든 성공·실패 응답은 Cache-Control no-store.
  responses:
    LoginRequired:
      description: 쿠키 없음·변조·만료. 본문 검사와 저장소 접근 전에 거절한다.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 로그인이 필요합니다 }
    AuthInvalid:
      description: 입력 형식·이름·비밀번호 8~128자 오류. INVALID_EMAIL, INVALID_NAME, PASSWORD_TOO_SHORT, PASSWORD_TOO_LONG 등.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthError' }
    AuthForbidden:
      description: 신뢰하지 않는 Origin·CSRF 요청 거절. 세션 생성 없음.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthError' }
    CardBadRequest:
      description: 날짜 형식 · 미래 날짜(기존 /api/rankings 문구) · hide가 4개 이상 · 그날 목록에 없는 id · 중복. 캐시 헤더 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            badFormat: { summary: 형식이 잘못된 날짜, value: { message: 날짜는 YYYY-MM-DD 형식으로 입력해 주세요 } }
            future: { summary: 오늘 이후 날짜, value: { message: 오늘 이후 날짜는 조회할 수 없습니다 } }
            badHide: { summary: 잘못된 hide, value: { message: 요청 형식이 올바르지 않습니다 } }
    CardNotFound:
      description: 그 날짜의 랭킹 없음(date를 생략했는데 저장된 랭킹이 하나도 없을 때 포함). 캐시 헤더 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 해당 날짜의 랭킹 데이터가 없습니다 }
    CardUnavailable:
      description: DB 준비 · 조회 실패. 캐시 헤더 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: API 서버에 연결할 수 없습니다 }
    PushBadRequest:
      description: 깨진 JSON · 칸 없음 · 받지 않는 endpoint(호스트 · 형식) · 키 형식(p256dh 65B 곡선 위의 점 · auth 16B)
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 요청 형식이 올바르지 않습니다 }
    PushForbidden:
      description: Origin 머리가 없거나 화면 주소와 다름(다른 사이트의 스크립트로 구독 · 해지 못 함)
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 요청 형식이 올바르지 않습니다 }
    PushTooLarge:
      description: 본문이 4,096B보다 큼
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 요청 형식이 올바르지 않습니다 }
  parameters:
    CardDate:
      name: date
      in: query
      required: false
      description: 카드 날짜(KST, YYYY-MM-DD). 생략하면 가장 최근 수집일. 오늘(KST) 이후면 400.
      schema: { type: string, format: date }
      example: '2026-10-07'
    CardHide:
      name: hide
      in: query
      required: false
      description: 카드에서 뺄 이슈 id를 쉼표로(최대 3개, 중복 없음, 그날 /api/widget items에 있는 id). 뺀 줄은 다음 순서 이슈로 채운다.
      schema: { type: string }
      example: '2026-10-07-pol-0,2026-10-07-eco-1'
  schemas:
    AuthError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    AuthUser:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    AuthResult:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
        token: { type: string, description: 라이브러리 응답. 화면은 저장하지 않고 HttpOnly 쿠키를 사용한다. }
    SectionKey:
      type: string
      enum: [pol, eco, soc, cul, wor, it]

    IssueId:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}-(pol|eco|soc|cul|wor|it)-\d+$'
      description: 날짜는 달력에 있는 날짜

    Ranking:
      type: object
      required: [date, updatedAt, sections]
      properties:
        date:
          type: string
          format: date
          description: 랭킹 날짜(KST, YYYY-MM-DD)
        updatedAt:
          type: string
          format: date-time
          description: 마지막 갱신 시각(ISO 8601, +09:00)
        sections:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/Section'

    Section:
      type: object
      required: [key, name, issues]
      properties:
        key:
          $ref: '#/components/schemas/SectionKey'
        name:
          type: string
          enum: [정치, 경제, 사회, 생활·문화, 세계, IT·과학]
        issues:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Issue'
      oneOf:
        - properties:
            key: { const: pol }
            name: { const: 정치 }
        - properties:
            key: { const: eco }
            name: { const: 경제 }
        - properties:
            key: { const: soc }
            name: { const: 사회 }
        - properties:
            key: { const: cul }
            name: { const: 생활·문화 }
        - properties:
            key: { const: wor }
            name: { const: 세계 }
        - properties:
            key: { const: it }
            name: { const: IT·과학 }

    Issue:
      type: object
      required: [id, date, section, rank, title, summary, articleCount, url]
      properties:
        id:
          $ref: '#/components/schemas/IssueId'
        date:
          type: string
          format: date
        section:
          $ref: '#/components/schemas/SectionKey'
        rank:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        summary:
          description: AI 3줄 요약. 없으면 null(화면은 "요약 없음 · 원문을 확인해 주세요")
          type: [array, 'null']
          minItems: 3
          maxItems: 3
          items:
            type: string
        articleCount:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri

    Widget:
      type: object
      required: [date, updatedAt, updatedLabel, morePath, items]
      properties:
        date:
          type: string
          format: date
          description: 랭킹 날짜(KST, YYYY-MM-DD). date를 생략한 /api/rankings의 date와 같음
        updatedAt:
          type: string
          format: date-time
          description: 마지막 갱신 시각(ISO 8601, +09:00). 같은 날 /api/rankings의 updatedAt과 같음
        updatedLabel:
          type: string
          description: 위젯 하단 문구. updatedAt을 화면 날짜 줄과 같은 꼴로 쓴 것({월}.{일} {오전·오후} {시}:{분} 수집, 예 10.17 오전 4:31 수집)
        morePath:
          type: string
          pattern: '^/'
          description: 작은 위젯 전체 · 줄 밖을 누를 때 여는 사이트 경로(랭킹 목록 /#list)
        items:
          type: array
          minItems: 1
          maxItems: 30
          description: 표시 순서대로(섹션 1위들 → 나머지)
          items:
            $ref: '#/components/schemas/WidgetItem'

    WidgetItem:
      type: object
      required: [id, section, title, path]
      properties:
        id:
          $ref: '#/components/schemas/IssueId'
        section:
          $ref: '#/components/schemas/SectionKey'
        title:
          type: string
        path:
          type: string
          pattern: '^/\?issue='
          description: 사이트에서 그 이슈 상세를 여는 경로(/?issue={id})

    CardCaption:
      type: object
      required: [date, dateLabel, updatedLabel, items, hidden, caption]
      properties:
        date:
          type: string
          format: date
          description: 카드 날짜(랭킹 date = 수집한 날)
        dateLabel:
          type: string
          description: 카드 오른쪽 위 날짜({월}월 {일}일 {요일}, 예 10월 19일 월요일)
        updatedLabel:
          type: string
          description: 같은 날 /api/widget의 updatedLabel(예 10.19 오전 6:34 수집)
        items:
          type: array
          minItems: 1
          maxItems: 6
          description: 카드와 같은 줄 · 같은 순서(원문 제목)
          items:
            type: object
            required: [id, section, title]
            properties:
              id: { $ref: '#/components/schemas/IssueId' }
              section: { $ref: '#/components/schemas/SectionKey' }
              title: { type: string }
        hidden:
          type: array
          maxItems: 3
          description: 요청 hide의 id(보낸 순서)
          items: { $ref: '#/components/schemas/IssueId' }
        caption:
          type: string
          maxLength: 2200
          description: 인스타그램 캡션(줄바꿈 포함, 해시태그 5개)

    Bookmark:
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [folderId, savedAt]
          properties:
            folderId:
              type: string
            savedAt:
              type: string
              format: date-time
              description: 저장 시각(ISO 8601)

    BookmarkCreate:
      type: object
      required: [issueId, folderId]
      properties:
        issueId:
          $ref: '#/components/schemas/IssueId'
        folderId:
          type: string
          minLength: 1

    Folder:
      description: 본인 폴더. 신규 ID는 f<UUID> 형식의 불투명 문자열이며 기존 ID도 유지한다. count는 본인 북마크만 센다.
      type: object
      required: [id, name, count]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 16
        count:
          type: integer
          minimum: 0

    FolderCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 글자 수는 앞뒤 공백을 뺀 뒤 코드 포인트로 셈(😀 1개 = 1자)
          minLength: 1
          maxLength: 16

    PushSubscriptionIn:
      description: 브라우저 PushSubscription.toJSON() 꼴. endpoint · keys만 쓰고 다른 칸은 무시한다
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: 푸시 서비스 주소(https:, 받는 호스트 4종 — /api/push/subscriptions post 설명)
        expirationTime:
          type: [number, 'null']
          description: 무시함
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              pattern: '^[A-Za-z0-9_-]+={0,2}$'
              description: base64url 65B(첫 바이트 0x04 · P-256 곡선 위의 점)
            auth:
              type: string
              pattern: '^[A-Za-z0-9_-]+={0,2}$'
              description: base64url 16B

    PushSubscriptionCreated:
      description: 새 구독 행을 넣었다는 표시(POST 201, O7). created 하나뿐
      type: object
      required: [created]
      additionalProperties: false
      properties:
        created: { type: boolean, const: true }

    PushSubscriptionRef:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
